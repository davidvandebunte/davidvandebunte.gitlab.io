       x="30.093462"
       y="39.661663"
       id="text1498"><tspan
         x="7"
         y="10.603013"
         id="tspan11139">You should always program as part of learning something. Does that mean in this case (while learning </tspan><tspan
         x="7"
         y="15.603003"
         id="tspan11141">category theory) you should learn Scala’s Cats library?
</tspan><tspan
         x="7"
         y="20.602994"
         id="tspan11143">
</tspan><tspan
         x="7"
         y="25.602984"
         id="tspan11145">Move a window to the back in Ubuntu. You’d like to be able to do this when you have e.g. 3 zathura windows </tspan><tspan
         x="7"
         y="30.602975"
         id="tspan11147">you want to pull back in front of your 3-screen terminal window:
</tspan><tspan
         x="7"
         y="35.602965"
         id="tspan11149">- https://askubuntu.com/questions/65580/how-can-i-easily-send-a-window-to-the-back-of-a-stack
</tspan><tspan
         x="7"
         y="40.602955"
         id="tspan11151">
</tspan><tspan
         x="7"
         y="45.602944"
         id="tspan11153">The terms “vertical” and “horizontal” are more confusing than many people realize (especially if there is not </tspan><tspan
         x="7"
         y="50.602933"
         id="tspan11155">text on a graph to help define which direction “up” is). This gets even more confusing if you’re doing multiple </tspan><tspan
         x="7"
         y="55.602921"
         id="tspan11157">reflections; how would you describe your reflections of (3.50) in your notes on SSC Definition 3.51?
</tspan><tspan
         x="7"
         y="60.60291"
         id="tspan11159">- https://en.wikipedia.org/wiki/Vertical_and_horizontal#Discussion
</tspan><tspan
         x="7"
         y="65.602898"
         id="tspan11161">
</tspan><tspan
         x="7"
         y="70.602891"
         id="tspan11163">Relate trees and data structures to your current study of preorders and partial orders:
</tspan><tspan
         x="7"
         y="75.602883"
         id="tspan11165">- https://en.wikipedia.org/wiki/Tree_(data_structure)
</tspan><tspan
         x="7"
         y="80.602875"
         id="tspan11167">- https://stackoverflow.com/questions/31867469/are-partially-ordered-trees-the-same-as-binary-trees
</tspan><tspan
         x="7"
         y="85.602868"
         id="tspan11169">- https://en.wikipedia.org/wiki/Big_O_notation
</tspan></text>
