---

.dind_login: &dind_login
  image:
    name: docker:19.03.12
  services:
    - docker:19.03.12-dind

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  <<: *dind_login
  script:
    - ./build-notes
  except:
    - master
  tags:
    - laptop

pages:
  <<: *dind_login
  script:
    - ./build-notes
  artifacts:
    paths:
      - public
  only:
    - master
  tags:
    - laptop
