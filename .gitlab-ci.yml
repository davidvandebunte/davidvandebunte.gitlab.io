---

.dind_login: &dind_login
  image:
    name: registry.gitlab.com/davidvandebunte/cicd:latest
  services:
    - docker:19.03.12-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker system info

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  <<: *dind_login
  script:
    - ./build-shared-notes
    - ./content/build-jln
    - ./build-executable-notes
  except:
    - master

pages:
  <<: *dind_login
  script:
    - ./build-shared-notes
    - ./content/build-jln
    - ./build-executable-notes
  artifacts:
    paths:
      - public
  only:
    - master
